[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "amplifier-module-tool-collab-core"
version = "1.0.0"
description = "Core collaboration tools with M365 provider and shared interfaces for Amplifier"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Michael Jabbour" }
]
keywords = ["amplifier", "collaboration", "m365", "teams", "sharepoint"]

dependencies = [
    "httpx>=0.27.0",
    "azure-identity>=1.15.0",
    "msgraph-sdk>=1.0.0",
    "fastmcp>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
amplifier-collab-mcp = "amplifier_module_tool_collab_core.mcp:main"

[project.entry-points."amplifier.modules"]
tool-collab-core = "amplifier_module_tool_collab_core:mount"

[project.urls]
Homepage = "https://github.com/michaeljabbour/amplifier-module-tool-collab-core"
Repository = "https://github.com/michaeljabbour/amplifier-module-tool-collab-core"

[tool.hatch.build.targets.wheel]
packages = ["amplifier_module_tool_collab_core"]
