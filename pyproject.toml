[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "amplifier-collab-core"
version = "1.0.0"
description = "Core collaboration interfaces for Amplifier - shared by M365, Slack, Google modules"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Michael Jabbour" }
]
keywords = ["amplifier", "collaboration", "interfaces"]

dependencies = [
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[dependency-groups]
dev = ["amplifier-core"]

[project.urls]
Homepage = "https://github.com/michaeljabbour/amplifier-collab-core"
Repository = "https://github.com/michaeljabbour/amplifier-collab-core"

[tool.hatch.build.targets.wheel]
packages = ["amplifier_collab_core"]
